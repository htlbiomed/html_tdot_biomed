<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meine Biomed-Webseite</title>
    <link rel="icon" href="img/logo.png">

    <style>
        body {
            font-family: Arial, sans-serif;

            /* ===== HIER ÄNDERN: Farbe vom Seitenhintergrund ===== */
            background-color: #bb3a56;
            text-align: center;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .infobox { background-color: #e0e7ff; }
        button { background-color: #6c63ff; }

        .infobox, .spielbox {
            max-width: 420px;
            margin: 20px auto;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }
        .spielbox { background: white; }
        button, .link {
            border: none;
            border-radius: 9px;
            padding: 11px 15px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin: 4px;
        }
        .link { display: inline-block; background: #d24592; text-decoration: none; }
        canvas { display: block; width: 100%; max-width: 512px; height: auto; margin: auto; }
        .figur { position: relative; max-width: 512px; margin: auto; }
        #regen { display: none; position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
        #sprechblase {
            position: absolute; top: 23%; left: 60%;
            background: white; padding: 12px;
            border: 2px solid #333; border-radius: 16px;
            font-size: 18px; font-weight: bold;
        }
        #status { font-weight: bold; }
    </style>
</head>
<body>

    <h1>Biomedizin- und Gesundheitstechnik</h1>

    <div class="infobox">
        <h2>👋 Willkommen auf meiner Webseite!</h2>

        <!-- ===== HIER ÄNDERN: Dein Name ===== -->
        <p><strong>Name:</strong> <span id="name">Lisa</span></p>

    </div>

    <div class="spielbox">
        <h2>🫀 Organe richtig zuordnen</h2>
        <p>Klicke zuerst links auf ein Organ und dann auf die passende Stelle im Körper.</p>
        <button id="reset">Neu starten</button>
        <button id="automatisch">Lösung anzeigen</button>
        <p id="status">Viel Spaß!</p>
    </div>

    <div class="figur">
        <!-- ===== HIER ÄNDERN: female oder male ===== -->
        <canvas id="spiel" width="512" height="768" data-figur="female"></canvas>
        <!-- ===== HIER ÄNDERN: 1.gif (Wolke) oder 2.gif (x) oder 3.gif (dislike) ===== -->
        <img id="regen" src="img/3.gif" alt="">
        
        <div id="sprechblase">Hallo!</div>
    </div>

    <p>Entdecke die spannende Welt der Biomedizin!</p>
    <a class="link" href="https://www.htl-salzburg.at/biomedizin-gesundheitstechnik.html" target="_blank" rel="noopener noreferrer">
        Mehr über unsere Abteilung
    </a>

    <!-- Die Spiellogik befindet sich in dieser Datei. Du musst sie NICHT bearbeiten. -->
    <script src="spiel.js"></script>
</body>
</html>
